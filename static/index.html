<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalshi Screener — by @openchud</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .meta { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .controls input, .controls select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .controls input { width: 260px; }
  .controls select { min-width: 120px; }
  .stats { display: flex; gap: 24px; margin-bottom: 16px; color: var(--dim); font-size: 13px; }
  .stats b { color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  thead { position: sticky; top: 0; z-index: 1; }
  th { background: var(--surface); color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; text-align: left; cursor: pointer; user-select: none; border-bottom: 2px solid var(--border); white-space: nowrap; }
  th:hover { color: var(--text); }
  th.sorted-asc::after { content: ' ▲'; color: var(--accent); }
  th.sorted-desc::after { content: ' ▼'; color: var(--accent); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:hover td { background: rgba(88,166,255,0.04); }
  .ticker { color: var(--accent); font-weight: 500; font-family: 'SF Mono', SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .title-cell { white-space: normal; max-width: 350px; line-height: 1.3; }
  .price { font-family: 'SF Mono', SFMono-Regular, Consolas, monospace; }
  .score-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); }
  .vol-bar { display: inline-block; height: 4px; border-radius: 2px; background: var(--green); opacity: 0.7; margin-right: 6px; vertical-align: middle; }
  .hot { color: var(--red); font-size: 11px; margin-left: 4px; }
  .spread-tight { color: var(--green); }
  .spread-wide { color: var(--red); }
  .spread-mid { color: var(--yellow); }
  .cat-badge { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--dim); }
  .signal { display: inline-block; border-radius: 3px; padding: 1px 5px; font-size: 10px; font-weight: 600; margin-right: 3px; }
  .signal-tight { background: rgba(63,185,80,0.15); color: var(--green); }
  .signal-wide { background: rgba(248,81,73,0.15); color: var(--red); }
  .signal-expiring { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .signal-moving { background: rgba(88,166,255,0.15); color: var(--accent); }
  .signal-contested { background: rgba(188,143,243,0.15); color: #bc8ff3; }
  .time-urgent { color: var(--red); font-weight: 600; }
  .time-soon { color: var(--yellow); }
  .time-later { color: var(--dim); }
  .hot-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 220px; max-width: 280px; flex-shrink: 0; }
  .hot-card .hot-title { font-size: 13px; font-weight: 500; line-height: 1.3; margin-bottom: 6px; white-space: normal; }
  .hot-card .hot-meta { font-size: 11px; color: var(--dim); display: flex; gap: 10px; }
  .hot-card .hot-price { font-family: 'SF Mono', SFMono-Regular, Consolas, monospace; font-size: 18px; font-weight: 600; color: var(--accent); }
  .hot-card a { color: var(--text); text-decoration: none; }
  .hot-card a:hover { color: var(--accent); }
  .footer { text-align: center; padding: 24px 0; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); margin-top: 24px; }
  .footer a { color: var(--accent); text-decoration: none; }
  .loading { text-align: center; padding: 60px 0; color: var(--dim); }
  @media (max-width: 768px) { .controls input { width: 100%; } td, th { padding: 6px 6px; font-size: 12px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🦞 <span>Kalshi Screener</span></h1>
    <div class="meta" id="updated">Loading...</div>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Search markets... (/ to focus, Esc to clear)">
    <select id="category-filter"><option value="">All Categories</option></select>
    <select id="time-filter">
      <option value="">Any Expiry</option>
      <option value="24">< 24h</option>
      <option value="72">< 3 days</option>
      <option value="168">< 1 week</option>
      <option value="720">< 30 days</option>
    </select>
    <select id="signal-filter">
      <option value="">Any Signal</option>
      <option value="tight">🟢 Tight Spread</option>
      <option value="wide">🔴 Wide Spread</option>
      <option value="expiring">🟡 Expiring</option>
      <option value="moving">🔵 Moving</option>
      <option value="contested">🟣 Contested</option>
      <option value="any">⚡ Has Signal</option>
    </select>
    <select id="sort-by">
      <option value="composite_score">Score</option>
      <option value="volume_24h">24h Volume</option>
      <option value="open_interest">Open Interest</option>
      <option value="spread">Spread</option>
      <option value="hours_to_close">Time to Close</option>
    </select>
  </div>

  <div id="hot-markets" style="display:none; margin-bottom:16px;">
    <div style="font-size:13px; color:var(--dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">🔥 Hot Right Now</div>
    <div id="hot-cards" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:8px;"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div id="table-wrap">
    <div class="loading" id="loading">Loading markets from Kalshi...</div>
    <table id="market-table" style="display:none">
      <thead>
        <tr>
          <th data-col="ticker">Ticker</th>
          <th data-col="title">Market</th>
          <th data-col="category">Category</th>
          <th data-col="yes_bid">Bid</th>
          <th data-col="yes_ask">Ask</th>
          <th data-col="spread">Spread</th>
          <th data-col="last_price">Last</th>
          <th data-col="volume_24h">24h Vol</th>
          <th data-col="open_interest">OI</th>
          <th data-col="composite_score">Score</th>
          <th data-col="price_change">Chg</th>
          <th data-col="hours_to_close">Expires</th>
          <th>Signals</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    Built by <a href="https://github.com/openchud" target="_blank">@openchud</a> 🦞
    · Powered by <a href="https://kalshi.com" target="_blank">Kalshi</a> public API
    · Data refreshes every 2 minutes
  </div>
</div>

<script>
let allMarkets = [];
let sortCol = 'composite_score';
let sortDir = 'desc';

async function fetchMarkets() {
  try {
    const resp = await fetch('/api/markets');
    const data = await resp.json();
    allMarkets = data.markets || [];

    document.getElementById('updated').textContent =
      data.updated_at ? `Updated: ${new Date(data.updated_at).toLocaleTimeString()}` : 'Loading...';

    // Populate category filter
    const cats = [...new Set(allMarkets.map(m => m.category).filter(Boolean))].sort();
    const sel = document.getElementById('category-filter');
    const current = sel.value;
    sel.innerHTML = '<option value="">All Categories</option>';
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
    sel.value = current;

    renderHotMarkets();
    renderTable();
  } catch (e) {
    document.getElementById('loading').textContent = 'Failed to load — retrying...';
  }
}

function renderHotMarkets() {
  // Pick markets that are contested, high-volume, or have interesting signals
  const hot = allMarkets
    .filter(m => m.signals && m.signals.length > 0 && m.volume_24h > 50 && m.category !== 'Multi-leg')
    .sort((a, b) => (b.signals.length * 1000 + b.volume_24h) - (a.signals.length * 1000 + a.volume_24h))
    .slice(0, 8);

  const wrap = document.getElementById('hot-markets');
  const cards = document.getElementById('hot-cards');
  if (hot.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  cards.innerHTML = hot.map(m => {
    const mid = ((m.yes_bid + m.yes_ask) / 2 * 100).toFixed(0);
    const sigs = m.signals.map(s => '<span class="signal signal-'+s+'">'+s+'</span>').join(' ');
    return `<div class="hot-card">
      <a href="https://kalshi.com/markets/${m.event_ticker}/${m.ticker}" target="_blank">
        <div class="hot-title">${esc(m.title.substring(0, 80))}</div>
        <div class="hot-price">${mid}¢</div>
        <div class="hot-meta">
          <span>${m.category}</span>
          <span>Vol: ${m.volume_24h.toLocaleString()}</span>
          <span>${fmtTime(m.hours_to_close)}</span>
        </div>
        <div style="margin-top:4px">${sigs}</div>
      </a>
    </div>`;
  }).join('');
}

function renderTable() {
  const search = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('category-filter').value;
  const time = parseFloat(document.getElementById('time-filter').value) || 0;

  let filtered = allMarkets.filter(m => {
    if (search && !m.ticker.toLowerCase().includes(search) && !m.title.toLowerCase().includes(search) && !m.category.toLowerCase().includes(search)) return false;
    if (cat && m.category !== cat) return false;
    if (time && (m.hours_to_close === null || m.hours_to_close > time)) return false;
    const sig = document.getElementById('signal-filter').value;
    if (sig === 'any' && (!m.signals || m.signals.length === 0)) return false;
    if (sig && sig !== 'any' && (!m.signals || !m.signals.includes(sig))) return false;
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av === null || av === undefined) av = -Infinity;
    if (bv === null || bv === undefined) bv = -Infinity;
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  // Stats
  document.getElementById('stats').innerHTML =
    `<span>Showing <b>${filtered.length}</b> of <b>${allMarkets.length}</b> markets</span>` +
    `<span>Avg spread: <b>${(filtered.reduce((s,m) => s + m.spread, 0) / (filtered.length||1) * 100).toFixed(1)}¢</b></span>` +
    `<span>Total 24h vol: <b>${(filtered.reduce((s,m) => s + m.volume_24h, 0)).toLocaleString()}</b></span>`;

  // Find max volume for bar scaling
  const maxVol = Math.max(...filtered.map(m => m.volume_24h), 1);

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.slice(0, 500).map(m => {
    const volPct = Math.round((m.volume_24h / maxVol) * 60);
    const isHot = m.volume_24h > 10000 || m.open_interest > 5000;
    return `<tr>
    <td class="ticker"><a href="https://kalshi.com/markets/${m.event_ticker}/${m.ticker}" target="_blank">${m.ticker}</a>${isHot ? '<span class="hot">🔥</span>' : ''}</td>
    <td class="title-cell">${esc(m.title)}</td>
    <td><span class="cat-badge">${esc(m.category || '—')}</span></td>
    <td class="price">${(m.yes_bid * 100).toFixed(0)}¢</td>
    <td class="price">${(m.yes_ask * 100).toFixed(0)}¢</td>
    <td class="price ${m.spread < 0.05 ? 'spread-tight' : m.spread < 0.15 ? 'spread-mid' : 'spread-wide'}">${(m.spread * 100).toFixed(0)}¢</td>
    <td class="price">${(m.last_price * 100).toFixed(0)}¢</td>
    <td><span class="vol-bar" style="width:${volPct}px"></span>${fmtNum(m.volume_24h)}</td>
    <td>${fmtNum(m.open_interest)}</td>
    <td><span class="score-bar" style="width:${Math.round(m.composite_score * 80)}px"></span> ${(m.composite_score * 100).toFixed(0)}</td>
    <td class="price ${(m.price_change||0) > 0.005 ? 'spread-tight' : (m.price_change||0) < -0.005 ? 'spread-wide' : ''}">${fmtChg(m.price_change)}</td>
    <td class="${m.hours_to_close !== null && m.hours_to_close < 6 ? 'time-urgent' : m.hours_to_close !== null && m.hours_to_close < 24 ? 'time-soon' : 'time-later'}">${fmtTime(m.hours_to_close)}</td>
    <td>${(m.signals||[]).map(s => '<span class="signal signal-'+s+'">'+s+'</span>').join('')}</td>
  </tr>`}).join('');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('market-table').style.display = '';

  // Update header sort indicators
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.col === sortCol) th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
  });
}

function fmtNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtChg(c) {
  if (!c || Math.abs(c) < 0.001) return '—';
  const cents = (c * 100).toFixed(1);
  return c > 0 ? `+${cents}¢` : `${cents}¢`;
}

function fmtTime(h) {
  if (h === null || h === undefined) return '—';
  if (h < 0) return 'Expired';
  if (h < 1) return `${Math.round(h * 60)}m`;
  if (h < 24) return `${h.toFixed(1)}h`;
  if (h < 168) return `${(h / 24).toFixed(1)}d`;
  return `${Math.round(h / 24)}d`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Event listeners
document.getElementById('search').addEventListener('input', renderTable);
document.getElementById('category-filter').addEventListener('change', renderTable);
document.getElementById('time-filter').addEventListener('change', renderTable);
document.getElementById('signal-filter').addEventListener('change', renderTable);
document.getElementById('sort-by').addEventListener('change', e => { sortCol = e.target.value; renderTable(); });

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortCol = col; sortDir = 'desc'; }
    document.getElementById('sort-by').value = col;
    renderTable();
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('search').value = '';
    document.getElementById('search').blur();
    renderTable();
  }
});

// Initial fetch + auto-refresh
fetchMarkets();
setInterval(fetchMarkets, 120000);
</script>
</body>
</html>
